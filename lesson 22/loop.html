<!DOCTYPE html>
<html>

<body>

    <h2>JavaScript For Loop</h2>
    <p id="demo"></p>

    <script>
        var fruits = ["Apple", "Mango", "Grapes", "Watermelon", "Banana"];

        // for (i = 4; i >= 0; i--) {

        for (i = 2; i < fruits.length; i++) {
            var text = fruits[i] + "<br>";
            document.write(text);
        }
    </script>

</body>

</html>
