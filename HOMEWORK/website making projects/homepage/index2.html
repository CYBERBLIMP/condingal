<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodie Restaurant</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #111;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: #023c38;
            padding: 15px 0;
            border-bottom: 1px solid rgba(156, 13, 13, 0.05);
        }

        .navbar-brand {
            color: #f5b301 !important;
            font-size: 28px;
            font-weight: bold;
        }

        .navbar-brand i {
            margin-right: 8px;
        }

        .nav-link {
            color: white !important;
            font-weight: 500;
            margin: 0 10px;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #f5b301 !important;
        }

        .book-btn {
            display: inline-block;
            background: #f5b301;
            color: #670d0d;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .book-btn:hover {
            background: #ffd54f;
            color: #820c0c;
        }

        /* Style fix for custom light toggler lines on a dark navbar background */
        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.2) !important;
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://w3.org' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 0.75%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
        }


        /* ================= BANNER ================= */

        .hero {
            position: relative;
            height: 650px;
            width: 100%;

            /* Uses the local image file you uploaded with dark gradient mask filters overlayed */
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
                url("banner.png");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            color: white;
        }

        .hero-content {
            max-width: 800px;
            padding: 0 20px;
            z-index: 2;
        }

        .hero-content h1 {
            font-size: 65px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }

        .hero-content p {
            font-size: 21px;
            margin-bottom: 35px;
            color: rgba(255, 255, 255, 0.9);
        }

        .menu-btn {
            display: inline-block;
            background: #f5b301;
            color: #111;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .menu-btn:hover {
            background: white;
            color: #111;
            transform: translateY(-3px);
        }


        /* ================= MOBILE RESPONSIVENESS ================= */

        @media (max-width: 768px) {

            .hero {
                height: 550px;
            }

            .hero-content h1 {
                font-size: 42px;
            }

            .hero-content p {
                font-size: 17px;
            }

            .nav-item {
                text-align: center;
                padding: 5px 0;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <!-- Restaurant Logo -->
            <a class="navbar-brand" href="#">
                <i class="bi bi-egg-fried"></i>
                Foodie
            </a>

            <!-- Mobile Hamburger Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu Links -->
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Gallery</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a class="book-btn" href="#">Book a Table</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ================= BANNER ================= -->
    <header class="hero">
        <div class="hero-content">
            <h1>Experience Culinary Excellence</h1>
            <p>Fresh ingredients, master chefs, and an unforgettable cozy ambiance.</p>
            <a href="#" class="menu-btn">Explore Our Menu</a>
        </div>
    </header>

    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://jsdelivr.net"></script>
</body>

</html>
